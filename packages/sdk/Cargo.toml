[package]
name = "gunmetal-sdk"
description = "Provider adapter SDK for adding upstream providers to Gunmetal."
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/gunmetal-sdk"
readme = "README.md"
keywords = ["ai", "inference", "providers", "sdk"]
categories = ["api-bindings", "development-tools"]
version.workspace = true

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures-util.workspace = true
gunmetal-core = { version = "0.1.15", path = "../sdk-core" }
gunmetal-storage = { version = "0.1.15", path = "../app-storage" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6.5"
